services:
  - type: web
    name: smart-parking-backend
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: supersecretjwtkeyforparking123
      - key: RAZORPAY_KEY_ID
        value: rzp_test_mockkeyid123
      - key: RAZORPAY_KEY_SECRET
        value: mockkeysecret123
      - key: MONGO_URI
        sync: false
