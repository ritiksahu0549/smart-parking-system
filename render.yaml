services:
  - type: web
    name: smart-parking-system
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: supersecretjwtkeyforparking123
      - key: RAZORPAY_KEY_ID
        value: rzp_test_mockkeyid123
      - key: RAZORPAY_KEY_SECRET
        value: mockkeysecret123
      - key: MONGO_URI
        sync: false
